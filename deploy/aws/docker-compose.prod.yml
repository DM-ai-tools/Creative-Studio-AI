# Production stack for a single EC2 host (nginx on :80).
# Usage (from repo root on server):
#   docker compose -f deploy/aws/docker-compose.prod.yml --env-file deploy/aws/.env up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: creativestudio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creativestudio}
      POSTGRES_USER: ${POSTGRES_USER:-csuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csuser} -d ${POSTGRES_DB:-creativestudio}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: creativestudio_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: creativestudio_backend
    restart: unless-stopped
    env_file: ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-csuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creativestudio}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}/api/v1
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CreativeStudio AI}
    container_name: creativestudio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: creativestudio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  app:
    driver: bridge
